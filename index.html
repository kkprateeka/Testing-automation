<!DOCTYPE html>
<html>
<head>
    <title>Automated Testing Tool</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Full screen background */
.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;

    background: url("background.png")
        no-repeat center center;
    background-size: cover;
}

/* Light grey overlay */
.overlay {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(200, 200, 200, 0.5); /* adjust opacity here */

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Header */
.header {
    position: absolute;
    top: 20px;

    padding: 12px 30px;
    font-size: 22px;
    font-weight: bold;
    color: white;

    background: linear-gradient(to right, #F37335, #FDC830);
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);

    left: 50%;
    transform: translateX(-50%);
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 300px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}
button {
    background: linear-gradient(to right, #F37335, #FDC830);
    border: none;

    padding: 12px 25px;
    border-radius: 50px; /* makes it rounded */

    color: white;
    cursor: pointer;

    font-size: 15px;
    font-weight: bold;

    transition: all 0.3s ease;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.loader {
    margin: 15px auto;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #F37335;
    border-radius: 50%;

    width: 40px;
    height: 40px;

    animation: spin 1s linear infinite;
}
.progress-container {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 20px;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #F37335, #FDC830);
    border-radius: 20px;
    transition: width 0.3s;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

</head>

<body>

<div class="background">
    <div class="overlay">

        <div class="header">
            🧪 Automated Testing Tool
        </div>

        <div class="card">
            <p class="label"><b>Upload your ZIP file</b></p>
            <select id="framework">
                <option value="python">Python</option>
                <option value="dotnet">.NET</option>
            </select>
            <br><br>
            <input type="file" id="fileInput" accept=".zip">
            <p id="fileName" class="file-name"></p>

            <button onclick="handleStart()">▶️ Start Testing </button>
            <div id="loader" class="loader" style="display:none;"></div>
            <div id="progressContainer" class="progress-container" style="display:none;">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

    </div>
</div>

<script>
console.log("NEW FRONTEND LOADED");

let selectedFile = null;

document.getElementById("fileInput").addEventListener("change", function(e) {
    selectedFile = e.target.files[0];
    document.getElementById("fileName").innerText = selectedFile ? selectedFile.name : "";
});

async function handleStart() {
    if (!selectedFile) {
        alert("Please upload a ZIP file");
        return;
    }

    // Show loader & progress
    document.getElementById("loader").style.display = "block";
    document.getElementById("progressContainer").style.display = "block";

    let progress = 0;
    const progressBar = document.getElementById("progressBar");

    // Fake progress animation (until backend ready)
    const interval = setInterval(() => {
        progress += 10;
        progressBar.style.width = progress + "%";

        if (progress >= 90) clearInterval(interval);
    }, 300);

    try {
        const formData = new FormData();
        formData.append("file", selectedFile);

        const framework = document.getElementById("framework").value;
        let apiurl = "";
        
        if (framework === "python") {
            apiurl = "http://localhost:8000/start-test";
        }
        else if (framework === "dotnet") {
            apiurl = "http://localhost:9000/start-test";
        }
        const response = await fetch(apiurl, {
            method: "POST",
            body: formData
        });

        const result = await response.json();
        console.log(result);
        if (result.error) {
            alert(result.error);
            return;
        }

        progressBar.style.width = "100%";

        clearInterval(interval);
progressBar.style.width = "100%";

// hide loader
document.getElementById("loader").style.display = "none";

// hide loader
document.getElementById("loader").style.display = "none";

// SIMPLE SUCCESS UI
let outputHTML = `
    <h2 style="color:green;">
        ✅ Testing Completed
    </h2>

    <p>
        Reports generated successfully
    </p>

    <br>

    <a href="${result.excel}">
        <button>
            📊 Download Excel Report
        </button>
    </a>

    <br><br>

    <a href="${result.pdf}">
        <button>
            📄 Download PDF Report
        </button>
    </a>
`;

// replace card content
document.querySelector(".card").innerHTML = outputHTML;

    } 
    catch (error) {
    console.error(error);

    clearInterval(interval);  // stop fake progress
    document.getElementById("loader").style.display = "none"; // hide loader
    progressBar.style.width = "0%"; // reset bar

    alert("Error starting test");
}
}
</script>

</body>
</html>
